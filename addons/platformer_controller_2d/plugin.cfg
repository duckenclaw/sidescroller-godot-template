[plugin]

name="Platformer Controller 2D"
description="State-machine 2D sidescroller character controller: walk/run/sprint/crouch, variable-height jump with coyote time + jump buffer, optional dash, a Camera2D follower and an AnimatedSprite2D hook. Mechanics are modular (config flags + removable state nodes), mirroring the FPS Controller. Depends on the Components Kit (StateMachine/State/Health)."
author="godot-game-kit"
version="1.0.0"
script="platformer_controller_2d.gd"
